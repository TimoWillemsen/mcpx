<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="mcpx logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151b33"/><stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#2ec5ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.35"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- prompt chevron -->
  <polyline points="104,170 184,250 104,330" fill="none" stroke="#3ddc97" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the x -->
  <g stroke="url(#accent)" stroke-width="52" stroke-linecap="round">
    <line x1="252" y1="168" x2="404" y2="320"/>
    <line x1="404" y1="168" x2="252" y2="320"/>
  </g>
  <!-- cursor -->
  <rect x="104" y="384" width="300" height="34" rx="17" fill="url(#accent)" opacity="0.9"/>
</svg>
