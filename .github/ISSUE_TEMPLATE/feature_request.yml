name: Feature request
description: Suggest an improvement to mcpx
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, not just the solution. Who runs into it (a person, a script, an agent)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like mcpx to do?
      description: Commands, flags, output or config you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
