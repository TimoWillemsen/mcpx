<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="mcpx: call any MCP server from your shell">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#2ec5ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>

  <!-- wordmark -->
  <g transform="translate(88 0)">
    <text x="0" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="104" font-weight="700" fill="#f4f6ff" letter-spacing="-3">mcp<tspan fill="url(#accent)">x</tspan></text>
    <rect x="0" y="196" width="72" height="6" rx="3" fill="url(#accent)"/>
    <text x="0" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#f4f6ff">Every MCP server, one command away.</text>
    <text x="0" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#9aa3c7">List and call MCP tools from any shell, script or coding agent.</text>
    <text x="0" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#9aa3c7">stdio · Streamable HTTP · SSE · OAuth · OS keychain</text>
  </g>

  <!-- terminal card -->
  <g transform="translate(748 74)">
    <rect width="452" height="252" rx="16" fill="#0f1428" stroke="#2a3157" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="6" fill="#ff5f57"/><circle cx="46" cy="26" r="6" fill="#febc2e"/><circle cx="66" cy="26" r="6" fill="#28c840"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17">
      <text x="26" y="84" fill="#e6e9ff"><tspan fill="#3ddc97">$</tspan> mcpx tools notes --text</text>
      <text x="26" y="114" fill="#9aa3c7">search_notes   Full-text search</text>
      <text x="26" y="140" fill="#9aa3c7">get_note       Fetch one note</text>
      <text x="26" y="184" fill="#e6e9ff"><tspan fill="#3ddc97">$</tspan> mcpx call notes search_notes \</text>
      <text x="26" y="210" fill="#e6e9ff">    '{"query":"release plan"}'</text>
      <text x="26" y="236" fill="url(#accent)">{ "content": [ … ] }</text>
    </g>
  </g>
</svg>
